name: support-ticket-system
services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m
  # Base histórica: recibe la auditoría con Spring Batch y guarda los metadatos de las ejecuciones.
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HISTORY_DB_NAME}
      POSTGRES_USER: ${HISTORY_DB_USERNAME}
      POSTGRES_PASSWORD: ${HISTORY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${HISTORY_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: support-ticket-system:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ORACLE_AUDIT_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_AUDIT_USERNAME: ${ORACLE_AUDIT_USERNAME}
      ORACLE_AUDIT_PASSWORD: ${ORACLE_AUDIT_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      TICKET_ADMIN_EMAIL: ${TICKET_ADMIN_EMAIL}
      PORTAL_API_KEY: ${PORTAL_API_KEY}
      ASSETS_API_EMAIL: ${ASSETS_API_EMAIL}
      ASSETS_API_PASSWORD: ${ASSETS_API_PASSWORD}
      HISTORY_DB_URL: jdbc:postgresql://postgres:5432/${HISTORY_DB_NAME}
      HISTORY_DB_USERNAME: ${HISTORY_DB_USERNAME}
      HISTORY_DB_PASSWORD: ${HISTORY_DB_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # Log del batch del histórico de auditoría, visible en ./logs/batch del proyecto.
      - ./logs:/app/logs

  # Servidor de correo de pruebas: recibe por SMTP (1025) y muestra los correos en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  mysql_data:
  oracle_data:
  postgres_data:

