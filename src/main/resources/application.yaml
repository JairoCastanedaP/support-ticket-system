spring:
  application:
    name: support-ticket-system

  datasource:
    url: jdbc:h2:mem:supporttickets
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Los scripts SQL se ejecutan después de que Hibernate cree las tablas.
    defer-datasource-initialization: true

  # Vista, procedimiento y datos iniciales (src/main/resources/db).
  sql:
    init:
      mode: always
      separator: "$$"
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

# Perfil local: la auditoría central usa una segunda base H2 en memoria.
# En el perfil docker esta configuración se reemplaza por Oracle.
app:
  datasource:
    oracle:
      url: jdbc:h2:mem:auditlocal
      username: sa
      password:
      driver-class-name: org.h2.Driver
  persistence:
    # H2 no ejecuta el procedimiento de MySQL; los indicadores solo se habilitan en el perfil docker.
    stored-procedures-enabled: false
