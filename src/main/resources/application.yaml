spring:
  application:
    name: support-ticket-system

  datasource:
    url: jdbc:h2:mem:supporttickets
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Perfil local: la auditoría central usa una segunda base H2 en memoria.
# En el perfil docker esta configuración se reemplaza por Oracle.
app:
  datasource:
    oracle:
      url: jdbc:h2:mem:auditlocal
      username: sa
      password:
      driver-class-name: org.h2.Driver