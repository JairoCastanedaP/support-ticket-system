spring:
  application:
    name: support-ticket-system

  datasource:
    url: jdbc:h2:mem:supporttickets
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Los scripts SQL se ejecutan después de que Hibernate cree las tablas.
    defer-datasource-initialization: true

  # Vista, procedimiento y datos iniciales (src/main/resources/db).
  sql:
    init:
      mode: always
      separator: "$$"
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/data.sql

  # Spring Batch: no ejecutar jobs al arrancar; crear sus tablas de metadatos en la base histórica.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  h2:
    console:
      enabled: true
      path: /h2-console

# Perfil local: la auditoría central usa una segunda base H2 en memoria.
# En el perfil docker esta configuración se reemplaza por Oracle.
app:
  datasource:
    oracle:
      url: jdbc:h2:mem:auditlocal
      username: sa
      password:
      driver-class-name: org.h2.Driver
    # Perfil local: el histórico de auditoría usa una tercera base H2 en memoria (modo PostgreSQL).
    history:
      url: jdbc:h2:mem:historylocal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      username: sa
      password:
      driver-class-name: org.h2.Driver
  persistence:
    # H2 no ejecuta el procedimiento de MySQL; los indicadores solo se habilitan en el perfil docker.
    stored-procedures-enabled: false
  # Servicios externos (etapa 10). Las credenciales llegan por variables de entorno.
  integrations:
    connect-timeout: 3s
    read-timeout: 5s
    assets:
      base-url: https://api.escuelajs.co/api/v1
      email: ${ASSETS_API_EMAIL:}
      password: ${ASSETS_API_PASSWORD:}
    directory:
      base-url: https://jsonplaceholder.typicode.com
  portal:
    api-key: ${PORTAL_API_KEY:}
  # Correos al resolver un ticket. En local quedan pendientes; el perfil docker los envía a Mailpit.
  notifications:
    enabled: false
    admin-email: ${TICKET_ADMIN_EMAIL:}
    from: ${MAIL_FROM:no-reply@support-ticket.local}
    interval-seconds: 30
    max-attempts: 3
  # Histórico de auditoría (etapa 11). Se vuelve a leer este margen antes del último evento copiado,
  # por si el relay entregó eventos con retraso; los ya copiados se descartan.
  batch:
    audit-history:
      overlap-minutes: 10

# Documentación OpenAPI: Swagger UI en /swagger-ui.html y el contrato en /v3/api-docs.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
  default-produces-media-type: application/json
